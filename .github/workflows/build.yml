name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only — release job overrides with write at job scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install pytest openpyxl pandas rank_bm25 jieba json-repair

      - name: Run unit tests
        run: |
          pytest tests/unit -v

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install pyinstaller requests

      - name: Inject repo info into installer
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          $repo  = "${{ github.event.repository.name }}"
          (Get-Content installer/installer.py) `
            -replace 'OWNER_PLACEHOLDER', $owner `
            -replace 'GITHUB_REPO\s*=\s*"Win10-Offline-AI"', "GITHUB_REPO = `"$repo`"" |
          Set-Content installer/installer.py

      - name: Build installer EXE
        run: |
          pyinstaller installer/installer.spec

      - name: Copy dist artifact
        shell: pwsh
        run: |
          Copy-Item "dist/WinLLM_Setup.exe" "WinLLM_Setup.exe"
          $size = [math]::Round((Get-Item "WinLLM_Setup.exe").length / 1MB, 1)
          echo "EXE size: ${size} MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinLLM_Setup
          path: WinLLM_Setup.exe
          retention-days: 7

  release:
    needs: build
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: WinLLM_Setup

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Win10 離線 AI — 最新版"
          body: |
            ## Win10 離線 AI 安裝包 v2.0

            ### 安裝方式
            1. 下載 `WinLLM_Setup.exe`
            2. 右鍵「以系統管理員身分執行」
            3. 勾選要安裝的模型，點擊「開始安裝」
            4. 安裝精靈自動完成所有步驟（含模型下載）

            ### 包含 AI 模型（自動從 GitHub 下載，全程走 GitHub 網域）
            | 模型 | 大小 | 說明 |
            |------|------|------|
            | **Qwen2.5-7B-Instruct Q4_K_M** | 4.4 GB | Excel Agent 主力，中文優異 |
            | **Qwen3-8B Q4_K_M** | 4.7 GB | 備選，多語言文件問答 |

            > 模型分段下載後自動合併匯入 Ollama，無需任何手動操作。
            > Python 套件已打包於 EXE 中，全程離線安裝。

            ### 支援文件格式
            PDF · Excel (.xlsx) · Word (.docx) · PowerPoint (.pptx) · TXT

            ### 系統需求
            - Windows 10 x64
            - 16 GB RAM（推薦）
            - 15 GB 可用磁碟空間

            > 建置時間：${{ github.run_number }}
          files: |
            WinLLM_Setup.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
