name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install pyinstaller requests

      - name: Inject repo info into installer
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          $repo  = "${{ github.event.repository.name }}"
          (Get-Content installer/installer.py) `
            -replace 'OWNER_PLACEHOLDER', $owner `
            -replace 'GITHUB_REPO\s*=\s*"Win10-Offline-AI"', "GITHUB_REPO = `"$repo`"" |
          Set-Content installer/installer.py

      - name: Build installer EXE
        run: |
          pyinstaller installer/installer.spec

      - name: Copy dist artifact
        shell: pwsh
        run: |
          Copy-Item "dist/WinLLM_Setup.exe" "WinLLM_Setup.exe"
          $size = [math]::Round((Get-Item "WinLLM_Setup.exe").length / 1MB, 1)
          echo "EXE size: ${size} MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Win10 離線 AI — 最新版"
          body: |
            ## Win10 離線 AI 安裝包 v1.1

            ### 安裝方式
            1. 下載 `WinLLM_Setup.exe`
            2. 右鍵「以系統管理員身分執行」
            3. 勾選要安裝的模型，點擊「開始安裝」
            4. 安裝精靈自動完成所有步驟（含模型下載）

            ### 包含 AI 模型（自動從 GitHub 下載，全程走 GitHub 網域）
            | 模型 | 大小 | 說明 |
            |------|------|------|
            | **Qwen3-8B Q4_K_M** | 4.7 GB | 推薦首選，多語言，文件理解最強 |
            | **Llama 3.1 8B Instruct Q4_K_M** | 4.6 GB | 通用對話，英文能力優秀 |

            > 模型分 3 段下載後自動合併匯入 Ollama，無需任何手動操作。

            ### 支援文件格式
            PDF · Excel (.xlsx) · Word (.docx) · PowerPoint (.pptx) · TXT

            ### 系統需求
            - Windows 10 x64
            - 16 GB RAM（推薦）
            - 15 GB 可用磁碟空間

            > 建置時間：${{ github.run_number }}
          files: |
            WinLLM_Setup.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
