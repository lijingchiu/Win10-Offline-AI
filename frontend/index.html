<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Win10 離線 AI 助手</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #161628;
    --surface2: #1e1e38;
    --border: #2a2a4a;
    --accent: #6c63ff;
    --accent2: #4cc9f0;
    --text: #e2e2f0;
    --text-dim: #8888aa;
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87171;
    --user-bubble: #1e3a5f;
    --ai-bubble: #1e1e38;
    --radius: 12px;
    --font: "Segoe UI", "Microsoft JhengHei UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-logo {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  .sidebar-logo small { color: var(--text-dim); font-size: 11px; }

  /* Model selector */
  .model-section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  #model-select {
    width: 100%;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  #model-status {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.green { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .dot.red { background: var(--error); }

  /* Agent tabs */
  .agent-section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .agent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .agent-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .agent-btn:hover { border-color: var(--accent); color: var(--text); }
  .agent-btn.active {
    background: rgba(108,99,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .agent-btn .icon { font-size: 16px; display: block; margin-bottom: 3px; }

  /* Doc list */
  .doc-section {
    padding: 12px 14px;
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .doc-section::-webkit-scrollbar { width: 4px; }
  .doc-section::-webkit-scrollbar-track { background: transparent; }
  .doc-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .doc-drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }
  .doc-drop-zone:hover, .doc-drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(108,99,255,0.05);
    color: var(--accent);
  }
  .doc-drop-zone .drop-icon { font-size: 24px; display: block; margin-bottom: 6px; }

  .doc-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 5px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .doc-item:hover { border-color: var(--border); }
  .doc-item.active { border-color: var(--accent); background: rgba(108,99,255,0.1); }
  .doc-icon { font-size: 18px; flex-shrink: 0; }
  .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-chars { color: var(--text-dim); font-size: 10px; }
  .doc-remove {
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 14px;
    flex-shrink: 0;
  }
  .doc-remove:hover { color: var(--error); background: rgba(248,113,113,0.1); }

  /* Settings at bottom of sidebar */
  .sidebar-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }
  .footer-btn {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .footer-btn:hover { color: var(--text); border-color: var(--accent2); }

  /* ── Main Chat Area ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* Chat header */
  #chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }
  #chat-header .mode-badge {
    background: rgba(108,99,255,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 100px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 600;
  }
  #chat-title {
    font-size: 14px;
    color: var(--text-dim);
    flex: 1;
  }
  .header-action {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 12px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .header-action:hover { color: var(--text); border-color: var(--accent2); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .message-group { margin-bottom: 24px; }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    background: var(--user-bubble);
    margin-left: auto;
    border-bottom-right-radius: 4px;
    color: #d0e8ff;
  }
  .msg.assistant {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .msg-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg-meta.user-meta { text-align: right; justify-content: flex-end; }
  .copy-btn {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    transition: color 0.15s;
    background: none;
    border: none;
    padding: 0;
  }
  .copy-btn:hover { color: var(--accent2); }

  /* Streaming cursor */
  .cursor { display: inline-block; width: 2px; height: 14px;
    background: var(--accent2); animation: blink 1s step-end infinite;
    vertical-align: text-bottom; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0 } }

  /* Code blocks inside messages */
  .msg code {
    background: rgba(0,0,0,0.3);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "Consolas", monospace;
    font-size: 13px;
    color: var(--accent2);
  }
  .msg pre {
    background: rgba(0,0,0,0.4);
    padding: 12px;
    border-radius: 8px;
    margin: 8px 0;
    overflow-x: auto;
  }
  .msg pre code { background: none; padding: 0; color: var(--accent2); }

  /* Doc context indicator */
  .doc-context-bar {
    background: rgba(108,99,255,0.08);
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .doc-context-bar.hidden { display: none; }

  /* Welcome screen */
  #welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }
  #welcome h2 { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
  #welcome p { color: var(--text-dim); font-size: 15px; margin-bottom: 32px; max-width: 500px; }
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 580px;
    width: 100%;
  }
  .quick-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-size: 13px;
    color: var(--text-dim);
  }
  .quick-card:hover {
    border-color: var(--accent);
    background: rgba(108,99,255,0.05);
    color: var(--text);
    transform: translateY(-2px);
  }
  .quick-card .qc-icon { font-size: 26px; margin-bottom: 8px; display: block; }

  /* Input area */
  #input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input-box {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    resize: none;
    max-height: 150px;
    min-height: 44px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  #input-box:focus { border-color: var(--accent); }
  #input-box::placeholder { color: var(--text-dim); }

  .input-actions {
    display: flex;
    gap: 6px;
    align-items: flex-end;
  }
  .icon-btn {
    width: 40px; height: 40px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text-dim);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  #send-btn {
    width: 44px; height: 44px;
    background: var(--accent);
    border: none;
    border-radius: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: white;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #7b74ff; transform: scale(1.05); }
  #send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }
  #send-btn.stop { background: var(--error); }

  .hint-text {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    text-align: center;
  }

  /* Loading spinner in message */
  .thinking {
    display: flex;
    gap: 4px;
    padding: 8px 0;
    align-items: center;
  }
  .thinking span {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .thinking span:nth-child(1) { animation-delay: -0.32s; }
  .thinking span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Settings panel */
  #settings-panel {
    position: fixed;
    top: 0; right: 0;
    width: 340px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 20px;
    z-index: 100;
    transform: translateX(100%);
    transition: transform 0.3s;
    overflow-y: auto;
  }
  #settings-panel.open { transform: none; }
  .settings-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .settings-close { cursor: pointer; color: var(--text-dim); font-size: 20px; }
  .settings-group { margin-bottom: 18px; }
  .settings-group label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .settings-group input, .settings-group select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
  }
  .settings-group input[type=range] {
    background: none;
    border: none;
    padding: 0;
    accent-color: var(--accent);
  }

  /* File hidden input */
  #file-input { display: none; }

  /* Responsive hide for very small screens */
  @media (max-width: 640px) {
    #sidebar { display: none; }
  }
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────── -->
<div id="sidebar">
  <div class="sidebar-logo">
    <h1>🤖 Win10 離線 AI</h1>
    <small>完全離線 · 本地運行 · 資料不外傳</small>
  </div>

  <!-- Model selector -->
  <div class="model-section">
    <div class="section-label">AI 模型</div>
    <select id="model-select">
      <option value="">載入中...</option>
    </select>
    <div id="model-status">
      <span class="dot" id="ollama-dot"></span>
      <span id="ollama-status-text">正在連線至 Ollama...</span>
    </div>
  </div>

  <!-- Agent types -->
  <div class="agent-section">
    <div class="section-label">助手模式</div>
    <div class="agent-grid">
      <button class="agent-btn active" data-agent="chat" onclick="setAgent('chat')">
        <span class="icon">💬</span>一般對話
      </button>
      <button class="agent-btn" data-agent="doc" onclick="setAgent('doc')">
        <span class="icon">📄</span>文件問答
      </button>
      <button class="agent-btn" data-agent="summarize" onclick="setAgent('summarize')">
        <span class="icon">📝</span>文件摘要
      </button>
      <button class="agent-btn" data-agent="extract" onclick="setAgent('extract')">
        <span class="icon">📊</span>資料提取
      </button>
      <button class="agent-btn" data-agent="translate" onclick="setAgent('translate')">
        <span class="icon">🌐</span>翻譯助手
      </button>
      <button class="agent-btn" data-agent="review" onclick="setAgent('review')">
        <span class="icon">🔍</span>審閱校對
      </button>
    </div>
  </div>

  <!-- Document list -->
  <div class="doc-section">
    <div class="section-label">已上傳文件</div>
    <div class="doc-drop-zone" id="drop-zone"
         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)"
         ondrop="onDrop(event)" onclick="triggerFileInput()">
      <span class="drop-icon">📂</span>
      點擊或拖放文件<br>
      <small style="font-size:10px">PDF · Excel · Word · PPT · TXT</small>
    </div>
    <div id="doc-list"></div>
  </div>

  <div class="sidebar-footer">
    <button class="footer-btn" onclick="clearChat()">🗑 清除對話</button>
    <button class="footer-btn" onclick="toggleSettings()">⚙ 設定</button>
  </div>
</div>

<!-- ── Main Area ─────────────────────────────────────── -->
<div id="main">
  <div id="chat-header">
    <span class="mode-badge" id="mode-badge">一般對話</span>
    <span id="chat-title">選擇模式並開始對話，或上傳文件進行分析</span>
    <button class="header-action" onclick="exportChat()">導出對話</button>
    <button class="header-action" onclick="triggerFileInput()">📎 上傳文件</button>
  </div>

  <div id="messages">
    <div id="welcome">
      <h2>你好！我是你的離線 AI 助手</h2>
      <p>完全在本機運行，資料不會上傳到任何伺服器。支援 PDF、Excel、Word、PPT 文件分析。</p>
      <div class="quick-actions">
        <div class="quick-card" onclick="quickPrompt('你好，請自我介紹一下你的能力')">
          <span class="qc-icon">👋</span>
          自我介紹
        </div>
        <div class="quick-card" onclick="triggerFileInput()">
          <span class="qc-icon">📄</span>
          上傳文件分析
        </div>
        <div class="quick-card" onclick="quickPrompt('請幫我整理以下內容的重點：\n')">
          <span class="qc-icon">📝</span>
          整理重點
        </div>
        <div class="quick-card" onclick="quickPrompt('請用繁體中文翻譯以下內容：\n')">
          <span class="qc-icon">🌐</span>
          中文翻譯
        </div>
        <div class="quick-card" onclick="quickPrompt('請分析以下數據並給出見解：\n')">
          <span class="qc-icon">📊</span>
          數據分析
        </div>
        <div class="quick-card" onclick="quickPrompt('請幫我寫一封商業郵件，主題是：\n')">
          <span class="qc-icon">✉️</span>
          商業郵件
        </div>
      </div>
    </div>
  </div>

  <!-- Context bar showing active docs -->
  <div class="doc-context-bar hidden" id="context-bar">
    <span>📎</span>
    <span id="context-bar-text">已載入文件上下文</span>
    <button onclick="clearDocContext()" style="margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;">✕ 清除</button>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea id="input-box" placeholder="輸入訊息... (Shift+Enter 換行，Enter 送出)"
                rows="1"
                onkeydown="onKeyDown(event)"
                oninput="autoResize(this)"></textarea>
      <div class="input-actions">
        <button class="icon-btn" title="上傳文件" onclick="triggerFileInput()">📎</button>
        <button id="send-btn" onclick="sendOrStop()" title="送出 (Enter)">➤</button>
      </div>
    </div>
    <div class="hint-text" id="hint-text">Ollama 連線中... 請稍候</div>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div class="settings-title">
    設定
    <span class="settings-close" onclick="toggleSettings()">✕</span>
  </div>
  <div class="settings-group">
    <label>Ollama 伺服器地址</label>
    <input type="text" id="setting-ollama-url" value="http://localhost:11434">
  </div>
  <div class="settings-group">
    <label>Temperature（創意度：0=精確，1=有創意）</label>
    <input type="range" id="setting-temp" min="0" max="1" step="0.05" value="0.7">
    <small id="temp-display" style="color:var(--text-dim);font-size:11px;">0.7</small>
  </div>
  <div class="settings-group">
    <label>最大輸出長度 (tokens)</label>
    <select id="setting-max-tokens">
      <option value="2048">2048</option>
      <option value="4096" selected>4096</option>
      <option value="8192">8192</option>
      <option value="16384">16384</option>
    </select>
  </div>
  <div class="settings-group">
    <label>系統提示詞（可留空）</label>
    <textarea id="setting-system" rows="4"
      style="width:100%;background:var(--surface2);border:1px solid var(--border);
             border-radius:8px;padding:8px;color:var(--text);font-size:12px;resize:vertical;font-family:var(--font);"
      placeholder="你是一位專業的文件分析助手..."></textarea>
  </div>
  <div class="settings-group">
    <label>文件上下文字數上限</label>
    <select id="setting-ctx-limit">
      <option value="4000">4,000 字</option>
      <option value="8000" selected>8,000 字</option>
      <option value="16000">16,000 字</option>
      <option value="32000">32,000 字</option>
    </select>
  </div>
  <button onclick="saveSettings()"
    style="width:100%;padding:10px;background:var(--accent);color:white;border:none;
           border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px;">
    儲存設定
  </button>
</div>

<input type="file" id="file-input"
       accept=".pdf,.docx,.doc,.xlsx,.xls,.pptx,.ppt,.txt,.csv,.md"
       multiple
       onchange="handleFileSelect(event)">

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
const state = {
  model: "",
  agent: "chat",
  docs: [],         // [{name, text, chars}]
  messages: [],     // [{role, content}]
  streaming: false,
  abortCtrl: null,
  settings: {
    ollamaUrl: "http://localhost:11434",
    temperature: 0.7,
    maxTokens: 4096,
    systemPrompt: "",
    ctxLimit: 8000,
  }
};

// ── Agent configs ──────────────────────────────────────────────────────────
const AGENTS = {
  chat: {
    label: "一般對話",
    system: "你是一個友善、博學的 AI 助手，用繁體中文回答問題。回答要清晰、有條理。",
  },
  doc: {
    label: "文件問答",
    system: "你是一個文件分析助手，請根據提供的文件內容回答問題。如果問題超出文件範圍，請說明。使用繁體中文。",
  },
  summarize: {
    label: "文件摘要",
    system: "你是一個專業摘要助手。請對提供的內容生成結構化摘要：\n1. 核心主旨（1-2句）\n2. 重要要點（條列式）\n3. 結論與建議\n使用繁體中文，保持簡潔有力。",
  },
  extract: {
    label: "資料提取",
    system: "你是一個資料提取專家。從文件中提取結構化資料，以表格、JSON 或條列式呈現。重點提取：數字、日期、名稱、關鍵指標。使用繁體中文。",
  },
  translate: {
    label: "翻譯助手",
    system: "你是一個專業翻譯助手。將內容翻譯成繁體中文，保持原意且自然流暢。如原文是中文，則翻譯成英文。",
  },
  review: {
    label: "審閱校對",
    system: "你是一個專業文件審閱員。請審閱提供的文件，找出：\n1. 邏輯錯誤或矛盾\n2. 語法和用詞問題\n3. 結構改進建議\n4. 內容完整性評估\n使用繁體中文提供具體改進意見。",
  },
};

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  loadSettings();
  checkOllama();
  setInterval(checkOllama, 15000);

  document.getElementById("setting-temp").addEventListener("input", function () {
    document.getElementById("temp-display").textContent = this.value;
  });
});

async function checkOllama() {
  const url = state.settings.ollamaUrl;
  try {
    const r = await fetch(`${url}/api/tags`, { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error();
    const data = await r.json();
    const models = (data.models || []).map(m => m.name);
    updateModelList(models);
    setOllamaStatus(true, models.length > 0
      ? `已連線 · ${models.length} 個模型`
      : "已連線但無模型");
  } catch {
    setOllamaStatus(false, "無法連線至 Ollama");
    updateModelList([]);
  }
}

function setOllamaStatus(ok, msg) {
  document.getElementById("ollama-dot").className = "dot " + (ok ? "green" : "red");
  document.getElementById("ollama-status-text").textContent = msg;
  document.getElementById("hint-text").textContent = ok
    ? "Enter 送出 · Shift+Enter 換行 · 📎 上傳文件"
    : "⚠️ 請確認 Ollama 已啟動 (執行 start.bat)";
}

function updateModelList(models) {
  const sel = document.getElementById("model-select");
  const prev = sel.value;
  sel.innerHTML = models.length
    ? models.map(m => `<option value="${m}">${m}</option>`).join("")
    : '<option value="">（無可用模型）</option>';
  if (prev && models.includes(prev)) sel.value = prev;
  state.model = sel.value;
}

// ── Agent ──────────────────────────────────────────────────────────────────
function setAgent(agent) {
  state.agent = agent;
  document.querySelectorAll(".agent-btn").forEach(b => b.classList.toggle("active", b.dataset.agent === agent));
  const cfg = AGENTS[agent];
  document.getElementById("mode-badge").textContent = cfg.label;
  document.getElementById("chat-title").textContent =
    agent === "chat" ? "一般對話模式" : `${cfg.label}模式 — 可上傳文件使用`;
}

// ── Documents ──────────────────────────────────────────────────────────────
function triggerFileInput() {
  document.getElementById("file-input").click();
}

function onDragOver(e) {
  e.preventDefault();
  document.getElementById("drop-zone").classList.add("drag-over");
}
function onDragLeave(e) {
  document.getElementById("drop-zone").classList.remove("drag-over");
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById("drop-zone").classList.remove("drag-over");
  handleFiles(Array.from(e.dataTransfer.files));
}
function handleFileSelect(e) {
  handleFiles(Array.from(e.target.files));
  e.target.value = "";
}

async function handleFiles(files) {
  for (const file of files) {
    showToast(`正在解析 ${file.name}...`);
    try {
      const text = await extractFile(file);
      addDoc(file.name, text);
      showToast(`✅ 已載入：${file.name}`, 3000);
    } catch (e) {
      showToast(`❌ 解析失敗：${file.name}`, 4000);
      console.error(e);
    }
  }
}

async function extractFile(file) {
  const ext = file.name.split(".").pop().toLowerCase();

  // For txt/md/csv, read directly in browser
  if (["txt", "md", "csv"].includes(ext)) {
    return await file.text();
  }

  // For binary formats, try server first
  const form = new FormData();
  form.append("file", file, file.name);
  try {
    const r = await fetch("/api/extract", { method: "POST", body: form,
      signal: AbortSignal.timeout(30000) });
    if (r.ok) {
      const d = await r.json();
      if (d.text && !d.error) return d.text;
    }
  } catch {}

  // Fallback: read as text
  return await file.text().catch(() => `[無法解析 ${file.name}]`);
}

function addDoc(name, text) {
  const existing = state.docs.findIndex(d => d.name === name);
  const doc = { name, text, chars: text.length };
  if (existing >= 0) state.docs[existing] = doc;
  else state.docs.push(doc);
  renderDocList();
  updateContextBar();
}

function removeDoc(name) {
  state.docs = state.docs.filter(d => d.name !== name);
  renderDocList();
  updateContextBar();
}

function clearDocContext() {
  state.docs = [];
  renderDocList();
  updateContextBar();
}

function renderDocList() {
  const icons = { pdf: "📕", xlsx: "📗", xls: "📗", docx: "📘", doc: "📘",
    pptx: "📙", ppt: "📙", txt: "📄", csv: "📊", md: "📄" };
  const list = document.getElementById("doc-list");
  list.innerHTML = state.docs.map(d => {
    const ext = d.name.split(".").pop().toLowerCase();
    const icon = icons[ext] || "📄";
    const kc = d.chars > 1000 ? Math.round(d.chars / 1000) + "K" : d.chars;
    return `
      <div class="doc-item active">
        <span class="doc-icon">${icon}</span>
        <span class="doc-name" title="${d.name}">${d.name}</span>
        <span class="doc-chars">${kc} 字</span>
        <span class="doc-remove" onclick="removeDoc('${d.name.replace(/'/g, "\\'")}')">✕</span>
      </div>`;
  }).join("");
}

function updateContextBar() {
  const bar = document.getElementById("context-bar");
  if (state.docs.length === 0) {
    bar.classList.add("hidden");
  } else {
    bar.classList.remove("hidden");
    const total = state.docs.reduce((s, d) => s + d.chars, 0);
    document.getElementById("context-bar-text").textContent =
      `已載入 ${state.docs.length} 份文件 · 共 ${Math.round(total / 1000)}K 字元`;
  }
}

function buildDocContext() {
  if (state.docs.length === 0) return "";
  const limit = state.settings.ctxLimit;
  let total = 0;
  let parts = [];
  for (const d of state.docs) {
    const remaining = limit - total;
    if (remaining <= 0) break;
    const chunk = d.text.slice(0, remaining);
    parts.push(`=== 文件：${d.name} ===\n${chunk}`);
    total += chunk.length;
  }
  return `以下是相關文件內容：\n\n${parts.join("\n\n---\n\n")}`;
}

// ── Chat ───────────────────────────────────────────────────────────────────
function onKeyDown(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!state.streaming) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 150) + "px";
}

function sendOrStop() {
  if (state.streaming) stopStreaming();
  else sendMessage();
}

function stopStreaming() {
  if (state.abortCtrl) state.abortCtrl.abort();
  state.streaming = false;
  document.getElementById("send-btn").className = "";
  document.getElementById("send-btn").textContent = "➤";
}

async function sendMessage() {
  const box = document.getElementById("input-box");
  const text = box.value.trim();
  if (!text) return;
  if (!state.model) {
    showToast("⚠️ 請先選擇模型，並確認 Ollama 已啟動");
    return;
  }

  box.value = "";
  autoResize(box);

  // Hide welcome if visible
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.style.display = "none";

  appendUserMessage(text);

  // Build messages
  const sysPrompt = state.settings.systemPrompt || AGENTS[state.agent].system;
  const docContext = buildDocContext();
  const userContent = docContext ? `${docContext}\n\n---\n用戶問題：${text}` : text;

  const msgs = [];
  if (sysPrompt) msgs.push({ role: "system", content: sysPrompt });
  // Keep last 10 turns of history
  const history = state.messages.slice(-20);
  msgs.push(...history);
  msgs.push({ role: "user", content: userContent });

  state.messages.push({ role: "user", content: text });

  await streamResponse(msgs);
}

function appendUserMessage(text) {
  const msgs = document.getElementById("messages");
  const group = document.createElement("div");
  group.className = "message-group";
  group.innerHTML = `
    <div class="msg user">${escHtml(text)}</div>
    <div class="msg-meta user-meta">
      <span>${new Date().toLocaleTimeString("zh-TW")}</span>
    </div>`;
  msgs.appendChild(group);
  msgs.scrollTop = msgs.scrollHeight;
}

async function streamResponse(messages) {
  state.streaming = true;
  state.abortCtrl = new AbortController();
  document.getElementById("send-btn").className = "stop";
  document.getElementById("send-btn").textContent = "⏹";

  const msgs = document.getElementById("messages");

  // Thinking indicator
  const group = document.createElement("div");
  group.className = "message-group";
  const bubble = document.createElement("div");
  bubble.className = "msg assistant";
  bubble.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div>`;
  group.appendChild(bubble);
  msgs.appendChild(group);
  msgs.scrollTop = msgs.scrollHeight;

  const url = `${state.settings.ollamaUrl}/api/chat`;
  let fullContent = "";

  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: state.abortCtrl.signal,
      body: JSON.stringify({
        model: state.model,
        messages,
        stream: true,
        options: {
          temperature: state.settings.temperature,
          num_predict: state.settings.maxTokens,
        },
      }),
    });

    if (!r.ok) {
      const err = await r.text();
      throw new Error(`HTTP ${r.status}: ${err}`);
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    bubble.innerHTML = "";
    let cursor = document.createElement("span");
    cursor.className = "cursor";
    bubble.appendChild(cursor);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = dec.decode(value).split("\n");
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const obj = JSON.parse(line);
          const token = obj?.message?.content || "";
          if (token) {
            fullContent += token;
            bubble.removeChild(cursor);
            bubble.innerHTML = renderMarkdown(fullContent);
            bubble.appendChild(cursor);
            msgs.scrollTop = msgs.scrollHeight;
          }
          if (obj.done) break;
        } catch {}
      }
    }
    bubble.removeChild(cursor);
    bubble.innerHTML = renderMarkdown(fullContent);

  } catch (e) {
    if (e.name !== "AbortError") {
      bubble.innerHTML = `<span style="color:var(--error)">❌ 錯誤：${escHtml(e.message)}</span>`;
    } else {
      if (!fullContent) group.remove();
    }
  }

  if (fullContent) {
    state.messages.push({ role: "assistant", content: fullContent });
    // Add meta row
    const meta = document.createElement("div");
    meta.className = "msg-meta";
    meta.innerHTML = `
      <span>${new Date().toLocaleTimeString("zh-TW")} · ${state.model}</span>
      <button class="copy-btn" onclick="copyText(this, \`${fullContent.replace(/`/g, "\\`")}\`)">複製</button>`;
    group.appendChild(meta);
  }

  state.streaming = false;
  state.abortCtrl = null;
  document.getElementById("send-btn").className = "";
  document.getElementById("send-btn").textContent = "➤";
  msgs.scrollTop = msgs.scrollHeight;
}

function renderMarkdown(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code class="lang-${lang}">${code.trimEnd()}</code></pre>`)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/^#{3} (.+)$/gm, "<h3 style='margin:10px 0 5px;color:var(--accent2)'>$1</h3>")
    .replace(/^#{2} (.+)$/gm, "<h2 style='margin:12px 0 6px;color:var(--accent)'>$1</h2>")
    .replace(/^#{1} (.+)$/gm, "<h1 style='margin:14px 0 8px;color:var(--accent)'>$1</h1>")
    .replace(/^- (.+)$/gm, "<li style='margin-left:16px'>$1</li>")
    .replace(/^\d+\. (.+)$/gm, "<li style='margin-left:16px;list-style:decimal'>$1</li>")
    .replace(/\n/g, "<br>");
}

function escHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function quickPrompt(text) {
  const box = document.getElementById("input-box");
  box.value = text;
  autoResize(box);
  box.focus();
  if (document.getElementById("welcome")) {
    document.getElementById("welcome").style.display = "none";
  }
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "已複製";
    setTimeout(() => btn.textContent = "複製", 2000);
  });
}

function clearChat() {
  state.messages = [];
  const msgs = document.getElementById("messages");
  msgs.innerHTML = `<div id="welcome">
    <h2>你好！我是你的離線 AI 助手</h2>
    <p>完全在本機運行，資料不會上傳到任何伺服器。</p>
  </div>`;
}

function exportChat() {
  if (state.messages.length === 0) { showToast("沒有對話記錄"); return; }
  const lines = state.messages.map(m =>
    `[${m.role === "user" ? "用戶" : "AI"}]\n${m.content}\n`
  );
  const blob = new Blob([lines.join("\n---\n\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `對話記錄_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

// ── Settings ───────────────────────────────────────────────────────────────
function toggleSettings() {
  document.getElementById("settings-panel").classList.toggle("open");
}

function saveSettings() {
  state.settings.ollamaUrl = document.getElementById("setting-ollama-url").value;
  state.settings.temperature = parseFloat(document.getElementById("setting-temp").value);
  state.settings.maxTokens = parseInt(document.getElementById("setting-max-tokens").value);
  state.settings.systemPrompt = document.getElementById("setting-system").value;
  state.settings.ctxLimit = parseInt(document.getElementById("setting-ctx-limit").value);
  localStorage.setItem("winllm_settings", JSON.stringify(state.settings));
  toggleSettings();
  checkOllama();
  showToast("✅ 設定已儲存");
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem("winllm_settings") || "{}");
    Object.assign(state.settings, s);
    document.getElementById("setting-ollama-url").value = state.settings.ollamaUrl;
    document.getElementById("setting-temp").value = state.settings.temperature;
    document.getElementById("temp-display").textContent = state.settings.temperature;
    document.getElementById("setting-max-tokens").value = state.settings.maxTokens;
    document.getElementById("setting-system").value = state.settings.systemPrompt;
    document.getElementById("setting-ctx-limit").value = state.settings.ctxLimit;
  } catch {}
}

// ── Toast ──────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, duration = 2500) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), duration);
}
</script>
</body>
</html>
